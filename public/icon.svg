<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0836"/>
      <stop offset="100%" stop-color="#050212"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0070f3"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 2.5D Retro Grid Lines -->
  <path d="M 0 380 L 512 380 M 0 420 L 512 420 M 0 460 L 512 460" stroke="#7928ca" stroke-width="2" opacity="0.4"/>
  <path d="M 256 320 L 64 512 M 256 320 L 160 512 M 256 320 L 256 512 M 256 320 L 352 512 M 256 320 L 448 512" stroke="#d946ef" stroke-width="2" opacity="0.4"/>

  <!-- Alien Invader 3D Silhouette -->
  <g filter="url(#glow)">
    <!-- Mandibles / Antennas -->
    <path d="M 176 140 L 196 180 L 156 180 Z" fill="url(#pinkGrad)"/>
    <path d="M 336 140 L 316 180 L 356 180 Z" fill="url(#pinkGrad)"/>

    <!-- Main Armor Body -->
    <path d="M 140 190 H 372 V 280 H 340 V 310 H 300 V 280 H 212 V 310 H 172 V 280 H 140 Z" fill="url(#pinkGrad)"/>
    
    <!-- Eyes -->
    <rect x="180" y="210" width="36" height="36" rx="6" fill="#00f0ff"/>
    <rect x="296" y="210" width="36" height="36" rx="6" fill="#00f0ff"/>

    <!-- Player Ship Silhouette at bottom -->
    <path d="M 256 370 L 286 430 L 256 415 L 226 430 Z" fill="url(#cyanGrad)"/>
    <!-- Lasers -->
    <line x1="240" y1="360" x2="240" y2="330" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="272" y1="360" x2="272" y2="330" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
